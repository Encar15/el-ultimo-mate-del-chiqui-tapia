name: Deploy Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: uqbar-project/wollok-web-tools@main

      - name: Parchear soporte para textSize()
        run: |
          node -e '
            const fs = require("fs");
            for (const archivo of ["game-index.js", "game-runner.js"]) {
              if (!fs.existsSync(archivo)) continue;
              const contenido = fs.readFileSync(archivo, "utf8");
              let pos = 0;
              while ((pos = contenido.indexOf("textColor", pos)) !== -1) {
                console.log("=== MATCH EN", archivo, "===");
                console.log(contenido.slice(Math.max(0, pos - 250), pos + 350));
                pos += 9;
              }
            }
          '

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        uses: actions/deploy-pages@v4