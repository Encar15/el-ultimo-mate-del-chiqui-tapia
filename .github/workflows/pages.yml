name: Deploy Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: uqbar-project/wollok-web-tools@main

      - name: Parchear soporte para textSize()
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            function buscarArchivosJS(dir) {
              let resultados = [];
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory() && entry.name !== ".git" && entry.name !== "node_modules") {
                  resultados = resultados.concat(buscarArchivosJS(full));
                } else if (entry.isFile() && entry.name.endsWith(".js")) {
                  resultados.push(full);
                }
              }
              return resultados;
            }

            const archivos = buscarArchivosJS(".");
            console.log("Archivos JS encontrados:", archivos);

            for (const archivo of archivos) {
              let contenido = fs.readFileSync(archivo, "utf8");
              if (contenido.includes("textSize")) {
                console.log("Match de textSize en:", archivo);
                // Muestra contexto alrededor de textSize para depurar si hace falta
                const idx = contenido.indexOf("textSize");
                console.log("Fragmento original:", contenido.slice(Math.max(0, idx - 120), idx + 180));

                // Reemplaza p.textSize(NUMERO) por lectura dinámica de visual.textSize (o visual.message("textSize"))
                const nuevo = contenido.replace(
                  /([a-zA-Z0-9_$]+)\.textSize\(\s*(\d+)\s*\)/g,
                  "$1.textSize((typeof visual !== \"undefined\" && visual.textSize) ? Number(visual.textSize) : $2)"
                );

                if (nuevo !== contenido) {
                  fs.writeFileSync(archivo, nuevo, "utf8");
                  console.log("Parche aplicado con éxito en:", archivo);
                }
              }
            }
          '

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        uses: actions/deploy-pages@v4